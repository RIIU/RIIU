<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#141b34"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <style>
      .sans { font-family: 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; }
      .blink { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .float { animation: float 6s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    </style>
  </defs>

  <!-- background -->
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#dots)"/>
  <circle cx="1050" cy="60" r="260" fill="url(#glow2)"/>
  <circle cx="120" cy="330" r="240" fill="url(#glow1)"/>

  <!-- left: intro -->
  <g class="sans">
    <text x="80" y="92" font-size="20" fill="#94a3b8" letter-spacing="3">HI THERE 👋  I'M</text>
    <text x="78" y="160" font-size="64" font-weight="800" fill="#f8fafc">Rakibul Islam</text>
    <rect x="80" y="178" width="120" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="80" y="222" font-size="24" font-weight="600" fill="url(#accent)">Full-Stack WordPress Designer &amp; Front-End Developer</text>

    <!-- stats -->
    <g font-size="17" fill="#cbd5e1">
      <text x="80" y="262"><tspan font-weight="800" fill="#38bdf8">5+</tspan> Years Experience</text>
      <text x="270" y="262" fill="#475569">•</text>
      <text x="292" y="262"><tspan font-weight="800" fill="#a78bfa">100+</tspan> PSD → HTML</text>
      <text x="462" y="262" fill="#475569">•</text>
      <text x="484" y="262">Responsive Design</text>
    </g>

    <!-- tech chips -->
    <g font-size="14" font-weight="600">
      <rect x="80"  y="290" width="104" height="32" rx="16" fill="#21759b" fill-opacity="0.18" stroke="#21759b"/>
      <text x="132" y="311" text-anchor="middle" fill="#7cc4e8">WordPress</text>
      <rect x="194" y="290" width="76"  height="32" rx="16" fill="#e34f26" fill-opacity="0.15" stroke="#e34f26"/>
      <text x="232" y="311" text-anchor="middle" fill="#f8a58c">HTML5</text>
      <rect x="280" y="290" width="68"  height="32" rx="16" fill="#1572b6" fill-opacity="0.18" stroke="#2f8ad6"/>
      <text x="314" y="311" text-anchor="middle" fill="#8cc4f2">CSS3</text>
      <rect x="358" y="290" width="98"  height="32" rx="16" fill="#f7df1e" fill-opacity="0.12" stroke="#d9c21a"/>
      <text x="407" y="311" text-anchor="middle" fill="#f7e66b">JavaScript</text>
      <rect x="466" y="290" width="74"  height="32" rx="16" fill="#61dafb" fill-opacity="0.12" stroke="#61dafb"/>
      <text x="503" y="311" text-anchor="middle" fill="#9ae8fd">React</text>
      <rect x="550" y="290" width="58"  height="32" rx="16" fill="#777bb4" fill-opacity="0.2" stroke="#8b8fd0"/>
      <text x="579" y="311" text-anchor="middle" fill="#c2c4f0">PHP</text>
      <rect x="618" y="290" width="96"  height="32" rx="16" fill="#7952b3" fill-opacity="0.2" stroke="#9a74d6"/>
      <text x="666" y="311" text-anchor="middle" fill="#cdb6f2">Bootstrap</text>
    </g>
  </g>

  <!-- right: code window -->
  <g class="float">
    <g transform="translate(830 62)">
      <rect width="380" height="236" rx="14" fill="#0f172a" stroke="#334155"/>
      <path d="M0 14 a14 14 0 0 1 14 -14 h352 a14 14 0 0 1 14 14 v22 h-380z" fill="#1e293b"/>
      <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
      <circle cx="42" cy="18" r="6" fill="#febc2e"/>
      <circle cx="62" cy="18" r="6" fill="#28c840"/>
      <text x="190" y="23" text-anchor="middle" class="mono" font-size="12" fill="#64748b">rakibul.js</text>

      <g class="mono" font-size="15" xml:space="preserve">
        <text x="22" y="70"><tspan fill="#c084fc">const</tspan><tspan fill="#e2e8f0"> dev = {</tspan></text>
        <text x="44" y="98"><tspan fill="#7dd3fc">name</tspan><tspan fill="#e2e8f0">: </tspan><tspan fill="#86efac">"Rakibul"</tspan><tspan fill="#e2e8f0">,</tspan></text>
        <text x="44" y="126"><tspan fill="#7dd3fc">role</tspan><tspan fill="#e2e8f0">: </tspan><tspan fill="#86efac">"WP Designer"</tspan><tspan fill="#e2e8f0">,</tspan></text>
        <text x="44" y="154"><tspan fill="#7dd3fc">learning</tspan><tspan fill="#e2e8f0">: </tspan><tspan fill="#86efac">"React.js"</tspan><tspan fill="#e2e8f0">,</tspan></text>
        <text x="44" y="182"><tspan fill="#7dd3fc">loves</tspan><tspan fill="#e2e8f0">: </tspan><tspan fill="#86efac">"Programming"</tspan></text>
        <text x="22" y="210"><tspan fill="#e2e8f0">};</tspan><tspan class="blink" fill="#38bdf8"> ▌</tspan></text>
      </g>
    </g>
  </g>
</svg>
